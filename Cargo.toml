[workspace]
resolver = "2"
# `con-ron-core` is the verified core (DESIGN.md §3.4: the Aeneas subset, the
# style lint, the provenance gate, the extraction); `arena-core` is the
# rewrite's second verified crate (§8.6).  `con-ron-dump` is *unverified*
# tooling -- the `con-ron-pins/1` reader of §3.6 (task #31) -- which Charon
# never sees and which `scripts/extract.sh`, `scripts/lint-rust-style.sh` and
# `scripts/provenance.py` are scoped away from; it is in the workspace so that
# `scripts/gates.sh` covers it.  `con-ron` is the frontend and the CLI (task
# #37) and `con-ron-arena` is the rewrite's binary (task #97 P4f: the driver,
# the CLI and the modeller seam over `arena-core`), which §1 puts outside the
# theorem: both are unverified like `con-ron-dump`, outside the style lint and
# the extraction for the same reason, and inside `provenance.py`'s roots --
# the citation gate is the only sync signal an unverified crate will have.
members = ["crates/arena-core", "crates/con-ron-core", "crates/con-ron-dump", "crates/con-ron", "crates/con-ron-arena"]
# The P2s spike's throw-away Rust (task #97s, DESIGN.md §8.6): excluded from
# the workspace so that nothing the gates run touches it.  `charon cargo` is
# run inside its own directory by `scripts/extract-spike.sh`.
exclude = ["crates/arena-spike"]

# The Aeneas model of the code is the checked-arithmetic one (an overflow is
# a `fail`), so the shipped binary must check too, or the model would not
# describe it (task #7).
[profile.release]
overflow-checks = true

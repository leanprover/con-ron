name = "con-ron"
defaultTargets = ["ConRon", "ConRonSpike"]

# con-leche, the Lean checker this port refines (DESIGN.md §1).  Pinned as a
# submodule; `lake build` only elaborates the modules we actually import.
[[require]]
name = "con-leche"
path = "../vendor/con-leche"

# The Aeneas Lean library, patched onto v4.33.0 by
# `scripts/setup-aeneas-lean.sh` (DESIGN.md, task #2).  The path is outside the
# git tree on purpose: the copy is a build artifact, so it lives in `_tmp/`.
[[require]]
name = "aeneas"
path = "../_tmp/aeneas-lean"

[[lean_lib]]
name = "ConRon"
roots = ["ConRon"]

# The task-#3/#5 spike is a *second* root, not part of `ConRon`, because it
# carries its own copy of the `Rc` model: `ConRon/Spike/LevelName/
# TypesExternal.lean` and `ConRon/Generated/TypesExternal.lean` both declare
# the top-level `alloc.rc.Rc`, so they cannot sit in one import graph
# ("environment already contains 'alloc.rc.Rc'").  Two library roots keeps
# both elaborating under a plain `lake build` while keeping them apart
# (DESIGN.md, task #12).
[[lean_lib]]
name = "ConRonSpike"
roots = ["ConRon.Spike.LevelName"]

# The `DeclC` dump (DESIGN.md §3.6, task #10): runs con-leche's frontend on an
# export and writes the parsed `List DeclC` in the `con-ron-decls/1` format
# (`ConRon/Dump/FORMAT.md`), then reads it back and compares.
[[lean_exe]]
name = "con-ron-dump"
root = "ConRon.Dump.Main"

# The build-time table generator (DESIGN.md §5 P1.5, task #22): prints Rust
# source that rebuilds con-leche's elaboration-time tables
# (`BasisKind.declsA`, later the Nat-op pin variants) with the crate's own
# smart constructors, into `crates/con-ron-core/src/kernel/basis_tables.rs`.
[[lean_exe]]
name = "con-ron-gen-tables"
root = "ConRon.Gen.Main"

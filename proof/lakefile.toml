name = "con-ron"
defaultTargets = ["ConRon", "ConRonSpike", "ConRonArena"]

# con-leche, the Lean checker this port refines (DESIGN.md §1).  A plain lake
# dependency (task #91), pinned by `rev`; `proof/lake-manifest.json`'s
# `con-leche` entry is the single source of truth for the pin (DESIGN.md
# §3.7).  `lake build` only elaborates the modules we actually import.
[[require]]
name = "con-leche"
git = "https://github.com/leanprover/con-leche"
rev = "78ded4b6fc9a4d9ab809e8ca2c75c56537c41bff"

# The Aeneas Lean library, patched onto v4.33.0 by
# `scripts/setup-aeneas-lean.sh` (DESIGN.md, task #2).  The path is outside the
# git tree on purpose: the copy is a build artifact, so it lives in `_tmp/`.
[[require]]
name = "aeneas"
path = "../_tmp/aeneas-lean"

# Task #22's finding: Aeneas's `step` tactic and its `@[step]` lemmas unify
# with `⦃ ⦄` goals only under the two `backward.*` options task #2's patch
# sets on the *aeneas* package; a downstream package does not inherit them.
# Set project-wide so every proof file may use `step`.
[leanOptions]
weak.backward.isDefEq.respectTransparency = false
weak.backward.do.legacy = true

[[lean_lib]]
name = "ConRon"
roots = ["ConRon"]

# The task-#3/#5 spike is a *second* root, not part of `ConRon`, because it
# carries its own copy of the `Rc` model: `ConRon/Spike/LevelName/
# TypesExternal.lean` and `ConRon/Generated/TypesExternal.lean` both declare
# the top-level `alloc.rc.Rc`, so they cannot sit in one import graph
# ("environment already contains 'alloc.rc.Rc'").  Two library roots keeps
# both elaborating under a plain `lake build` while keeping them apart
# (DESIGN.md, task #12).
[[lean_lib]]
name = "ConRonSpike"
roots = ["ConRon.Spike.LevelName"]

# The arena checker (B) of DESIGN.md §8 — a third library root, because it is
# a *new* checker rather than a refinement layer over `ConRon.Generated`: it
# imports con-leche's kernel types (for the denotation) and nothing from
# `ConRon.Refine`.  Task #97 P2a.
[[lean_lib]]
name = "ConRonArena"
roots = ["ConRon.Arena"]

# (The P2s spike of task #97s was a fourth root here, `ConRonArenaSpike` over
# `ConRon.Arena.Spike`, which priced the proof idioms of §8's two theorems on
# three functions before P2b-P2d started at scale.  Task #97-SWAP-2 deleted
# it, with `crates/arena-spike` and `scripts/extract-spike.sh`: the idiom it
# chose is DESIGN.md's task-#97s section, and P3's `ConRon/Bridge/` is where
# it is written at scale.)

# The build-time table generator (DESIGN.md §5 P1.5, task #22): prints Rust
# source that rebuilds con-leche's elaboration-time tables
# (`BasisKind.declsA`, later the Nat-op pin variants) with the crate's own
# smart constructors, into `crates/con-ron-core/src/kernel/basis_tables.rs`.
[[lean_exe]]
name = "con-ron-gen-tables"
root = "ConRon.Gen.Main"

# The `Nat`-operation pin dump (DESIGN.md §3.6's runtime-data decision, task
# #31): writes `ConLeche.natOpPinSets` in the `con-ron-pins/1` format
# (`ConRon/Dump/FORMAT.md`) and reads it back.  `scripts/gen-pins.sh` embeds
# the result in the verified core, and `con-ron --pins FILE` reads a file in
# that format as a test override.
[[lean_exe]]
name = "con-ron-dump-pins"
root = "ConRon.Dump.Pins"

# (B), THE LEAN ARENA CHECKER's driver (DESIGN.md §8.4, task #97 P2f).
# con-leche's command line and con-leche's exit codes over
# `ConRon.Arena.runPipeline`, so that `scripts/diff-e2e.sh --bin=…` can run
# the same 348 fixtures against this binary and against `con-ron`.  Not a
# default target: `lake build` elaborates the proof library, and the arena
# checker's gate is the differential, not the build.
[[lean_exe]]
name = "con-ron-lean"
root = "ConRon.Arena.Main"

# The `ExprOps` micro-benchmark (DESIGN.md §8.6 P2b, task #97b).  The
# performance phase comes before the proofs, so the memo and cutoff choices of
# `ConRon/Arena/ExprOps.lean` have to be measurable from the day they are
# made: this builds a 50 000-node application spine, a 10 000-binder
# telescope and a 25-node DAG tower denoting 2^24 tree nodes, and times
# `instantiate1`, `abstract1` and `instantiateLevelParams` over each.  Not a
# default target: it is a measurement, not a deliverable.
[[lean_exe]]
name = "con-ron-arena-bench"
root = "ConRon.Arena.Bench"

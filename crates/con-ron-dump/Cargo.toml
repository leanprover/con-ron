[package]
name = "con-ron-dump"
version = "0.1.0"
edition = "2021"
description = "Reader and writer for the `con-ron-decls/1` dump format; UNVERIFIED tooling outside the Aeneas subset (DESIGN.md §3.6, tasks #10 and #19)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "con-ron-dump-check"
path = "src/bin/con-ron-dump-check.rs"

# `con-ron-check` moved to `crates/con-ron` at task #40: it is the same driver
# as the `con-ron` binary, reading a `con-ron-decls/1` dump instead of a raw
# stream, and it now shares `con_ron::driver` with it.  This crate is the dump
# format's reader and writer, below both.

[dependencies]
con-ron-core = { path = "../con-ron-core" }
# The global allocator of the *unverified* binaries only (task #35; the
# allocator is invisible to Charon, so the Lean model of the core is
# untouched).  `mimalloc` is the default because it measured best on `init`;
# see `src/lib.rs` for the `#[global_allocator]` and DESIGN.md task #35 for
# the numbers.
mimalloc = { version = "0.1.52", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }

[features]
# `mimalloc` wins on `init`, so it is the default; `--no-default-features`
# gives glibc `malloc` back, and `--no-default-features --features jemalloc`
# selects jemalloc.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

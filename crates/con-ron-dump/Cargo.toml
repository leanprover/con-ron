[package]
name = "con-ron-dump"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reader and writer for the `con-ron-pins/1` dump format; UNVERIFIED tooling outside the Aeneas subset (DESIGN.md §3.6, tasks #31 and #80)"

[lib]
path = "src/lib.rs"

# Task #80 retired the `con-ron-decls/1` half of this crate along with the
# checker-only differential seam it served (`con-ron-check`,
# `con-ron-dump-check`, `scripts/diff-fixtures.sh`): `scripts/diff-e2e.sh`
# runs the whole binary on every fixture's raw export and subsumes it.  What
# is left is the `con-ron-pins/1` reader and writer of task #31 — the format
# `scripts/gen-pins.sh` embeds and `con-ron --pins FILE` reads — and
# `natdec`, the decimal parser the frontend shares.

[dependencies]
con-ron-core = { path = "../con-ron-core" }
# The global allocator of the *unverified* binaries only (task #35; the
# allocator is invisible to Charon, so the Lean model of the core is
# untouched).  `mimalloc` is the default because it measured best on `init`;
# see `src/lib.rs` for the `#[global_allocator]` and DESIGN.md task #35 for
# the numbers.
mimalloc = { version = "0.1.52", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }

[features]
# `mimalloc` wins on `init`, so it is the default; `--no-default-features`
# gives glibc `malloc` back, and `--no-default-features --features jemalloc`
# selects jemalloc.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

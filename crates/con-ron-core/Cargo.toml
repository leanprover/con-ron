[package]
name = "con-ron-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The verified core of con-ron: con-leche's checkDecls, transliterated (DESIGN.md §3)"

[lib]
path = "src/lib.rs"

[dependencies]

# No `[package.metadata.charon]`: nothing in this crate is opaque to Charon.

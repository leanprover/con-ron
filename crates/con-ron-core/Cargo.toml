# `Expr` handle being outside Aeneas's subset by construction; task #97-SWAP-2
# retired both modules and put `Expr` back on `ron::ptr::P` = `std::sync::Arc`,
# so the crate's whole external surface is `std`'s again -- the four `Arc`
# operations and `str::as_bytes` (DESIGN.md §3.2, OVERVIEW §8.1).

[package]
name = "con-ron-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The verified core of con-ron: con-leche's checkDecls, transliterated (DESIGN.md §3)"

[lib]
path = "src/lib.rs"

[dependencies]

# `charon cargo` reads its options from here as well as from the command line
# (task #94).  `ron::node` is the one module Charon cannot translate — raw
# pointers, `AtomicUsize`, `std::alloc` — and the one module it must not need
# to: it is an *external hole* in exactly the sense DESIGN.md §3.2 gives
# `alloc::sync::Arc`, modeled by hand in `TypesExternal.lean` /
# `FunsExternal.lean`.  Marking it opaque declares its items without their
# bodies, which is what puts them in the templates that
# `scripts/extract.sh`'s unmodelled-external rule then checks.
#
# `ExprView` is the exception and is pulled back to transparent: it is a plain
# enum of shared borrows with no `unsafe` anywhere near it, every reader in the
# core matches on it, and the model wants it as the ordinary inductive it is.
[package.metadata.charon]
opaque = ["con_ron_core::ron::node"]
include = ["con_ron_core::ron::node::ExprView"]

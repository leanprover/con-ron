[package]
name = "con-ron-arena"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The arena checker's driver and CLI (DESIGN.md §8.6, task #97 P4f): con-leche's `Main.lean` over `arena-core`, the binary `scripts/diff-e2e.sh --bin` runs.  UNVERIFIED tooling outside the Aeneas subset, like `crates/con-ron`"

[lib]
name = "con_ron_arena"
path = "src/lib.rs"

[[bin]]
name = "con-ron-arena"
path = "src/bin/con-ron-arena.rs"

[dependencies]
arena-core = { path = "../arena-core" }
con-ron-core = { path = "../con-ron-core" }
# `con-ron` is the OTHER binary's unverified crate, and this one REUSES two
# things from it rather than growing a second copy: the in-process modeller
# (`con_ron::in_model`, which `in_model`'s adapter here drives across the
# representation seam) and the flag values, the exit-code mapping and the
# rendering of `con_ron::driver`, which are `Main.lean`'s own and must read
# the same in both binaries.  Taken with NO default features so that the
# allocator choice is made by the `[features]` below and nowhere else.
con-ron = { path = "../con-ron", default-features = false }
# `con-ron-dump` carries the `#[global_allocator]` (task #35's mimalloc) and
# the `con-ron-pins/1` reader of `--pins`: the same edge `crates/con-ron` has,
# for the same two reasons.
con-ron-dump = { path = "../con-ron-dump", default-features = false }

# THE GLOBAL ALLOCATOR IS SELECTED HERE, exactly as `crates/con-ron`'s manifest
# selects it for the other binary (task #89):
#
#   cargo build --release                                   mimalloc (default)
#   cargo build --release --no-default-features              glibc `malloc`
#   cargo build --release --no-default-features \
#               --features jemalloc                          jemalloc
#
# and `-p con-ron-arena` may be added to any of the three.  The attribute
# itself stays in `con-ron-dump` (`src/lib.rs`), which owns the optional
# dependencies; these three features forward to its.  `--help` prints
# `con_ron_dump::ALLOCATOR`, so a measurement names the allocator it measured.
[features]
default = ["mimalloc"]
mimalloc = ["con-ron-dump/mimalloc"]
jemalloc = ["con-ron-dump/jemalloc"]
